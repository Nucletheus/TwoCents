[package]
name = "twocents-desktop"
version = "0.1.0"
edition = "2021"
description = "TwoCents — Slint UI + plotters (migrates features from the web app)"
default-run = "twocents-desktop"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
csv = "1.3"
rfd = "0.15"
plotters = { version = "0.3.5", default-features = false, features = [
  "bitmap_backend",
  "line_series",
  "ttf",
] }
eframe = "0.34.2"
egui_extras = "0.34.2"
