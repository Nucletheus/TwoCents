[package]
name = "twocents-desktop"
version = "0.1.3"
edition = "2021"
rust-version = "1.85"
license-file = "LICENSE"
description = "Local-first household finance and budgeting for couples. Rust + egui + SQLite, fully offline"
repository = "https://github.com/Nucletheus/TwoCents"
default-run = "twocents-desktop"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
csv = "1.3"
rfd = "0.15"
eframe = { version = "0.36.2", features = ["persistence"] }
egui_extras = { version = "0.36.2", features = ["datepicker", "serde"] }
egui_plot = "0.37"
chrono = "0.4.44"
jiff = "0.2.24"
log = "0.4"
resvg = "0.44"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
lto = true
strip = true
codegen-units = 1

